appId: de.jokagaming.iracing-overlay
productName: iRacing Overlay

directories:
  output: dist

# electron-vite baut nach out/ (main/preload/renderer) - das ist alles,
# was fuer den gepackten Build gebraucht wird. package.json wird von
# electron-builder ohnehin automatisch mitgenommen.
files:
  - out/**/*
  - package.json

# resources/ enthaelt die per scripts/generate-icons.mjs erzeugten Icons.
# tray-icon.png wird zur Laufzeit gebraucht (src/main/resources.ts) und
# muss deshalb als Ressource mitkopiert werden, nicht nur als Build-Input
# fuer den Installer.
extraResources:
  - from: resources
    to: .
    filter:
      - '*.png'

# @irsdk-node/native laedt eine .node-Datei per dlopen - das funktioniert
# nur mit einem echten Dateipfad, nicht aus dem asar-Archiv heraus (asar
# ist kein echtes Dateisystem, nur ein von Electrons fs-Patch emuliertes).
# Ohne diesen Eintrag scheitert jeder Aufruf von IRacingSDK.IsSimRunning()/
# startSDK() im gepackten Build lautlos (unhandled rejection, siehe
# connector.ts) - iRacing wird dann selbst bei laufendem Sim nie erkannt.
asarUnpack:
  - '**/node_modules/@irsdk-node/native/**'

win:
  target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Noetig, damit electron-builder ein app-update.yml in den Build packt (das
# sagt electron-updater zur Laufzeit, wo er nach neuen Versionen suchen
# soll) - ohne diesen Block wuesste die App selbst nach einem Release nicht,
# gegen welchen Feed sie pruefen soll. Ein lokales `npm run package` laedt
# dadurch noch NICHTS hoch (siehe README, "Releases veroeffentlichen") -
# das passiert nur mit explizitem `--publish` und gesetztem GH_TOKEN.
publish:
  provider: github
  owner: Jokagaming
  repo: iracing-overlay
  # Ohne das legt electron-builder das Release nur als Entwurf an - erst
  # ein manueller Klick auf "Publish release" in der GitHub-UI macht es
  # sichtbar/downloadbar. Mit "release" ist es sofort nach dem CI-Lauf live.
  releaseType: release
